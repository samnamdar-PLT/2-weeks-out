<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 Weeks Out — Ticket Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214;
    --card:#1c1c20;
    --card-hover:#212126;
    --hairline:#302f34;
    --dash:#3c3b41;
    --text:#eae7e0;
    --muted:#8f8d92;
    --amber:#f2c14e;
    --teal:#4fc8bf;
    --coral:#ff6b6a;
    --today:#e8543f;
    --tm-blue:#0a5cff;
    --vivid-pink:#ff3d81;
    --stub-orange:#ff7a1a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  ::selection{background:var(--amber);color:#121214;}

  html{ scrollbar-width:thin; scrollbar-color:var(--hairline) var(--bg); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--hairline); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--muted); }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    background:var(--bg);
    padding:14px 24px;
    border-bottom:1px solid var(--hairline);
  }
  .header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .title-block{flex:0 0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);margin:0 0 2px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;letter-spacing:.02em;
    margin:0;line-height:1.1;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  h1 span.count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--muted);letter-spacing:0;
  }
  .meta-line{
    flex-basis:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;color:var(--muted);
    margin-top:2px;
  }

  .sheet-tabs{
    display:flex;gap:2px;align-items:flex-end;
    overflow-x:auto;flex-wrap:nowrap;
    scrollbar-width:thin;
    max-width:1600px;margin:10px auto 0;
  }
  .sheet-tab{
    display:flex;align-items:center;gap:7px;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    white-space:nowrap;
    padding:7px 10px;
    border:none;background:transparent;color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    border-radius:6px 6px 0 0;
    transition:color .15s ease, background .15s ease;
    flex:0 0 auto;
  }
  .sheet-tab:hover{color:var(--text);background:rgba(255,255,255,.04);}
  .sheet-tab.active{color:var(--text);border-bottom-color:var(--amber);}
  .tab-close{
    opacity:0;font-size:14px;line-height:1;color:var(--muted);
    transition:opacity .15s ease, color .15s ease;
    padding:0 1px;
  }
  .sheet-tab:hover .tab-close{opacity:1;}
  .tab-close:hover{color:var(--coral);}
  .sheet-tab.add-tab{color:var(--muted);font-size:16px;padding:7px 13px;}
  .sheet-tab.add-tab:hover{color:var(--amber);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 auto;}
  .sort-toggle{
    display:flex;border:1px solid var(--hairline);border-radius:7px;overflow:hidden;flex:0 0 auto;
  }
  .sort-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    padding:8px 10px;border:none;background:var(--card);color:var(--muted);
    cursor:pointer;white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .sort-btn + .sort-btn{border-left:1px solid var(--hairline);}
  .sort-btn.active{background:var(--teal);color:#0d211f;}
  .sort-btn:not(.active):hover{background:var(--card-hover);color:var(--text);}
  .search-wrap{position:relative;flex:1 1 200px;min-width:160px;}
  .search-wrap input{
    width:100%;
    background:var(--card);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px 10px 34px;
    border-radius:8px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--amber);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;
    padding:10px 14px;border-radius:8px;
    border:1px solid var(--hairline);
    background:var(--bg);color:var(--text);
    cursor:pointer;white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--muted);background:var(--card-hover);}
  .btn.primary{background:var(--amber);color:#151310;border-color:var(--amber);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  input[type=file]{display:none;}

  /* ---------- Body / list ---------- */
  main{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .main-inner{max-width:1600px;margin:0 auto;padding:22px 24px 80px;}

  .day-grid{
    display:grid;
    grid-template-columns:repeat(var(--cols, 3), minmax(0, 1fr));
    gap:12px;
    margin-bottom:4px;
  }
  .col-stepper{
    display:flex;align-items:center;gap:2px;
    border:1px solid var(--hairline);border-radius:7px;
    overflow:hidden;flex:0 0 auto;
  }
  .col-btn{
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;
    width:30px;height:100%;padding:8px 0;border:none;
    background:var(--card);color:var(--muted);cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .col-btn:hover{background:var(--card-hover);color:var(--text);}
  .col-btn:disabled{opacity:.35;cursor:default;}
  .col-btn:disabled:hover{background:var(--card);color:var(--muted);}
  .col-count{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);
    padding:0 8px;border-left:1px solid var(--hairline);border-right:1px solid var(--hairline);
    background:var(--card);white-space:nowrap;align-self:stretch;display:flex;align-items:center;
  }

  .day-heading{
    background:var(--bg);
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;letter-spacing:.02em;
    color:var(--text);
    padding:14px 0 8px;
    display:flex;align-items:center;gap:10px;
  }
  .day-heading .tag-today{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--today);color:#fff;
    padding:3px 7px;border-radius:4px;
    transform:translateY(-1px);
  }

  .ticket{
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:1px solid var(--hairline);
    border-radius:10px;
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .ticket:hover{border-color:#4a4950;}
  .ticket-toolbar{
    display:flex;justify-content:flex-end;
    padding:6px 6px 0;
  }
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;
    border-radius:6px;
    border:1px solid transparent;
    background:transparent;color:var(--muted);
    cursor:pointer;padding:0;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{background:var(--card-hover);border-color:var(--hairline);color:var(--text);}
  .icon-btn.notes-btn.has-note{color:var(--amber);}
  .icon-btn.notes-btn.active{color:var(--teal);background:var(--card-hover);border-color:var(--hairline);}
  .ticket-main{display:flex;}

  .ticket-info{
    flex:1 1 auto;
    min-width:0;
    padding:10px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:5px;
    justify-content:center;
  }
  .ev-name{
    font-size:16px;font-weight:700;color:var(--text);
    line-height:1.3;
  }
  .ev-venue{
    font-size:13.5px;color:var(--muted);
    line-height:1.3;
  }
  .ev-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--amber);
    letter-spacing:.02em;
  }

  .perf{
    position:relative;
    width:0;
    border-left:2px dashed var(--dash);
    flex:0 0 auto;
    margin-top:10px;
  }
  .perf::before,.perf::after{
    content:"";
    position:absolute;left:50%;
    width:16px;height:16px;
    background:var(--card);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .perf::before{top:-9px;}
  .perf::after{bottom:-9px;}

  .ticket-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:10px 12px 16px;
    justify-content:center;
    min-width:165px;
  }
  .link-row{display:flex;gap:4px;}
  .link-btn{
    flex:1 1 auto;
    min-width:0;
    display:flex;align-items:center;justify-content:space-between;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;font-weight:600;
    text-decoration:none;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid transparent;
    color:#141316;
    transition:filter .15s ease, transform .1s ease;
  }
  .link-btn:hover{filter:brightness(1.1);}
  .link-btn:active{transform:scale(.98);}
  .link-btn.site-tm{background:var(--tm-blue);color:#fff;}
  .link-btn.site-vivid{background:var(--vivid-pink);color:#fff;}
  .link-btn.site-stub{background:var(--stub-orange);color:#fff;}
  .link-btn.site-other{background:var(--amber);color:#141316;}
  .link-btn svg{flex:0 0 auto;opacity:.75;}
  .copy-btn{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    width:26px;
    border-radius:6px;
    border:1px solid var(--hairline);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    padding:0;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .copy-btn:hover{color:var(--text);border-color:var(--muted);background:var(--card-hover);}
  .copy-btn .icon-check{display:none;}
  .copy-btn.copied{color:var(--teal);border-color:var(--teal);}
  .copy-btn.copied .icon-copy{display:none;}
  .copy-btn.copied .icon-check{display:block;}
  .no-links{
    font-family:'Inter',sans-serif;
    font-size:12.5px;color:var(--muted);
    padding:8px 10px;
  }

  /* ---------- Notes ---------- */
  .notes-preview{
    border-top:1px solid var(--hairline);
    padding:9px 18px 11px;
    background:rgba(255,255,255,.012);
  }
  .note-preview-text{
    font-size:12px;color:var(--muted);line-height:1.4;font-style:italic;
  }
  .notes-panel{
    border-top:1px solid var(--hairline);
    padding:12px 16px 14px;
    background:rgba(255,255,255,.015);
  }
  .notes-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:0 0 6px;
  }
  .notes-textarea{
    width:100%;min-height:52px;resize:vertical;
    background:var(--bg);border:1px solid var(--hairline);border-radius:6px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;
    padding:8px 10px;outline:none;
  }
  .notes-textarea:focus{border-color:var(--teal);}

  /* ---------- Empty state ---------- */
  .empty{
    max-width:520px;margin:80px auto;text-align:center;
    padding:0 24px;
  }
  .empty .ticket-icon{font-size:40px;margin-bottom:14px;}
  .empty h2{
    font-family:'Bebas Neue',sans-serif;font-size:30px;
    margin:0 0 8px;letter-spacing:.02em;
  }
  .empty p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 20px;}
  .drop-zone{
    border:1.5px dashed var(--hairline);
    border-radius:12px;
    padding:34px 20px;
    color:var(--muted);
    font-size:13.5px;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop-zone.drag{border-color:var(--amber);background:rgba(242,193,78,.05);}

  .no-results{color:var(--muted);font-size:14px;padding:40px 0;text-align:center;}

  @media (max-width:560px){
    h1{font-size:20px;}
    .day-grid{grid-template-columns:1fr;}
    .ticket-main{flex-direction:column;}
    .perf{border-left:none;border-top:2px dashed var(--dash);width:auto;height:0;}
    .perf::before{top:auto;left:-9px;bottom:-9px;}
    .perf::after{left:auto;right:-9px;bottom:-9px;top:auto;}
    .ticket-actions{flex-direction:row;flex-wrap:wrap;min-width:0;}
    .link-row{flex:1 1 30%;}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="header-inner">
    <div class="title-block">
      <p class="eyebrow">2 Weeks Out</p>
      <h1>Ticket Watch <span class="count" id="countLabel"></span></h1>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search event or venue…">
      </div>
      <div class="sort-toggle" id="sortToggle">
        <button class="sort-btn" data-sort="date">By date</button>
        <button class="sort-btn active" data-sort="upload">As uploaded</button>
      </div>
      <div class="col-stepper" id="colStepper" title="Columns">
        <button class="col-btn" id="colMinus" type="button" aria-label="Fewer columns">−</button>
        <span class="col-count" id="colCount">3</span>
        <button class="col-btn" id="colPlus" type="button" aria-label="More columns">+</button>
      </div>
      <button class="btn primary" id="uploadBtn">Upload CSV</button>
      <button class="btn ghost" id="clearBtn" style="display:none;">Clear data</button>
      <input type="file" id="fileInput" accept=".csv">
    </div>
    <p class="meta-line" id="metaLine"></p>
  </div>
  <div class="sheet-tabs" id="sheetTabs"></div>
</header>

<main id="main">
  <div class="main-inner">
    <div class="empty" id="emptyState">
      <div class="ticket-icon">🎟️</div>
      <h2>This sheet is empty</h2>
      <p>Upload a CSV to fill this sheet. After that, each new upload creates its own tab named after the file, so nothing gets overwritten. Use the menu above to search, sort, or switch sheets.</p>
      <div class="drop-zone" id="dropZone">Drag a CSV here, or use the menu above to upload</div>
    </div>
    <div id="listRoot"></div>
  </div>
</main>

<script>
const $ = sel => document.querySelector(sel);
const fileInput = $('#fileInput');
const uploadBtn = $('#uploadBtn');
const clearBtn = $('#clearBtn');
const dropZone = $('#dropZone');
const emptyState = $('#emptyState');
const listRoot = $('#listRoot');
const searchInput = $('#searchInput');
const countLabel = $('#countLabel');
const metaLine = $('#metaLine');
const sheetTabs = $('#sheetTabs');
const sortToggle = $('#sortToggle');
const colMinus = $('#colMinus');
const colPlus = $('#colPlus');
const colCount = $('#colCount');

let allEvents = [];
let sheets = [];
let activeSheetId = null;
let sortMode = 'upload'; // 'date' | 'upload'
let notes = {}; // eventKey -> note text, scoped to the active sheet
let openNotesKey = null; // eventKey of the one card whose notes panel is expanded, if any
let columnCount = 3;
const MIN_COLS = 1, MAX_COLS = 6;

function applyColumnCount(){
  document.documentElement.style.setProperty('--cols', columnCount);
  colCount.textContent = columnCount;
  colMinus.disabled = columnCount <= MIN_COLS;
  colPlus.disabled = columnCount >= MAX_COLS;
}

async function loadColumnCount(){
  try{
    const res = await storageGet('ui:columns');
    if(res && res.value){
      const n = parseInt(res.value, 10);
      if(!isNaN(n)) columnCount = Math.min(MAX_COLS, Math.max(MIN_COLS, n));
    }
  }catch(e){ /* keep default */ }
  applyColumnCount();
}

colMinus.addEventListener('click', () => {
  if(columnCount <= MIN_COLS) return;
  columnCount--;
  applyColumnCount();
  storageSet('ui:columns', String(columnCount));
});
colPlus.addEventListener('click', () => {
  if(columnCount >= MAX_COLS) return;
  columnCount++;
  applyColumnCount();
  storageSet('ui:columns', String(columnCount));
});

// ---------- CSV parsing ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return { headers: [], dataRows: [] };
  const headers = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1)
    .filter(r => r.some(cell => cell && cell.trim()))
    .map(r => headers.map((_, idx) => (r[idx] !== undefined ? r[idx].trim() : '')));
  return { headers, dataRows };
}

// Finds the column index matching any of the given header aliases
// (case-insensitive, trimmed). Lets us support several CSV layouts.
function findColumn(headers, aliases){
  const normalized = headers.map(h => (h || '').trim().toLowerCase());
  for(const alias of aliases){
    const idx = normalized.indexOf(alias);
    if(idx !== -1) return idx;
  }
  return -1;
}

// Guesses a ticket site name from a URL when no "Primary Site" column
// is provided (e.g. a sheet that only has a "TM Link" column).
function inferSiteFromUrl(url){
  try{
    const host = new URL(url).hostname.replace(/^www\./, '');
    if(host.includes('ticketmaster')) return 'ticketmaster';
    if(host.includes('axs')) return 'axs';
    if(host.includes('vividseats')) return 'vividseats';
    if(host.includes('stubhub')) return 'stubhub';
    return host.split('.')[0];
  }catch(e){ return ''; }
}

function parseEventDate(str){
  if(!str) return null;

  // e.g. "Mon, August 17, 2026at 11:00 AM"
  let m = str.match(/([A-Za-z]+),?\s+([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})\s*at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(m){
    const [, , monthName, day, year, hour, minute, ampm] = m;
    const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
    const monthIdx = months.indexOf(monthName.toLowerCase());
    if(monthIdx === -1) return null;
    let h = parseInt(hour,10);
    if(ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
    if(ampm.toUpperCase() === 'AM' && h === 12) h = 0;
    return new Date(parseInt(year,10), monthIdx, parseInt(day,10), h, parseInt(minute,10));
  }

  // e.g. "Sunday, 8/30, 12:00 PM" — no year given, so infer one.
  m = str.match(/^[A-Za-z]+,\s*(\d{1,2})\/(\d{1,2}),\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(m){
    const [, month, day, hour, minute, ampm] = m;
    let h = parseInt(hour,10);
    if(ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
    if(ampm.toUpperCase() === 'AM' && h === 12) h = 0;
    return inferYearedDate(parseInt(month,10), parseInt(day,10), h, parseInt(minute,10));
  }

  return null;
}

// Builds a full date from a month/day/time that had no year in the source
// text. Assumes the current year unless that would land far in the past
// (more than ~90 days ago), in which case it rolls to next year — handles
// CSVs exported near a year boundary for events months out.
function inferYearedDate(month, day, hour, minute){
  const now = new Date();
  let year = now.getFullYear();
  let d = new Date(year, month - 1, day, hour, minute);
  const ninetyDaysAgo = new Date(now.getTime() - 90 * 24 * 3600 * 1000);
  if(d < ninetyDaysAgo){
    year += 1;
    d = new Date(year, month - 1, day, hour, minute);
  }
  return d;
}

function siteLabel(site){
  if(!site) return 'Tickets';
  const s = site.trim().toLowerCase();
  if(s === 'ticketmaster') return 'Ticketmaster';
  if(s === 'axs') return 'AXS';
  return site.charAt(0).toUpperCase() + site.slice(1);
}

// Picks the button color for the "primary" ticket link based on which
// site it actually is (a sheet's Primary Site is usually Ticketmaster or
// AXS, but could occasionally resolve to VividSeats/StubHub too).
function siteClass(site){
  const s = (site || '').trim().toLowerCase();
  if(s === 'ticketmaster') return 'site-tm';
  if(s === 'vividseats') return 'site-vivid';
  if(s === 'stubhub') return 'site-stub';
  return 'site-other';
}

function recordsFromCSV(text){
  const { headers, dataRows } = parseCSV(text);
  if(!headers.length) return [];

  const nameIdx = findColumn(headers, ['event name', 'event', 'name']);
  const sessionIdx = findColumn(headers, ['session']);
  const venueIdx = findColumn(headers, ['venue']);
  const dateIdx = findColumn(headers, ['date', 'date/time', 'event date']);
  const primarySiteIdx = findColumn(headers, ['primary site', 'site']);
  const primaryLinkIdx = findColumn(headers, ['primary link', 'tm link', 'ticketmaster link', 'link']);
  const vividIdx = findColumn(headers, ['vividseats link', 'vivid link', 'vividseats', 'vivid']);
  const stubIdx = findColumn(headers, ['stubhub link', 'stubhub']);

  let lastSection = ''; // tracks bare-name rows like "Arthur Ashe" or "Grounds Passes"
  const records = [];

  dataRows.forEach(row => {
    const nonEmpty = row.filter(v => v);
    if(!nonEmpty.length) return; // fully blank row

    const dateVal = dateIdx !== -1 ? row[dateIdx] : '';
    const hasAnyLink = [primaryLinkIdx, vividIdx, stubIdx].some(idx => idx !== -1 && row[idx]);
    const parsedDate = dateVal ? parseEventDate(dateVal) : null;

    if(!hasAnyLink && !parsedDate){
      // A row with no ticket link and nothing that parses as a date is a
      // section/category label (e.g. "Arthur Ashe", "Grounds Passes"),
      // not an event — even if its lone value happens to sit in the same
      // column normal rows use for the date.
      lastSection = nonEmpty[0];
      return;
    }

    let venue = venueIdx !== -1 ? row[venueIdx] : '';
    if(!venue) venue = lastSection;

    let name = nameIdx !== -1 ? row[nameIdx] : '';
    if(!name) name = sessionIdx !== -1 ? row[sessionIdx] : '';
    if(!name) name = venue || 'Untitled event';

    const primaryLink = primaryLinkIdx !== -1 ? row[primaryLinkIdx] : '';
    let primarySite = primarySiteIdx !== -1 ? row[primarySiteIdx] : '';
    if(!primarySite && primaryLink) primarySite = inferSiteFromUrl(primaryLink);

    const dateObj = parsedDate;

    records.push({
      name,
      venue,
      dateStr: dateVal,
      dateObj: dateObj ? dateObj.toISOString() : null,
      primarySite,
      primaryLink,
      vividLink: vividIdx !== -1 ? row[vividIdx] : '',
      stubLink: stubIdx !== -1 ? row[stubIdx] : ''
    });
  });

  return records;
}

// ---------- Storage ----------
// window.storage only exists inside the Claude.ai artifact viewer. When this
// page is hosted elsewhere (GitHub Pages, a local file, etc.) we fall back
// to the browser's own localStorage so saving still works.
const hasClaudeStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function');

async function storageGet(key){
  if(hasClaudeStorage()){
    try{ return await window.storage.get(key, false); }
    catch(e){ return null; }
  }
  const v = localStorage.getItem(key);
  return v !== null ? { value: v } : null;
}

async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ return await window.storage.set(key, value, false); }
    catch(e){ /* fall through to localStorage as backup */ }
  }
  localStorage.setItem(key, value);
  return { value };
}

async function storageDelete(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); return; }
    catch(e){ /* fall through */ }
  }
  localStorage.removeItem(key);
}

function makeSheetId(){
  return 'sh_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Turns an uploaded filename into a readable sheet name, avoiding
// collisions with sheets that already exist.
function sheetNameFromFile(file){
  const base = (file && file.name ? file.name.replace(/\.csv$/i, '') : '').trim();
  let name = base || 'Sheet';
  const existing = new Set(sheets.map(s => s.name));
  if(!existing.has(name)) return name;
  let n = 2;
  while(existing.has(`${name} (${n})`)) n++;
  return `${name} (${n})`;
}

async function persistSheetsIndex(){
  await storageSet('sheets:index', JSON.stringify(sheets));
}

async function loadSheets(){
  try{
    const idxRes = await storageGet('sheets:index');
    if(idxRes && idxRes.value){
      sheets = JSON.parse(idxRes.value);
    }
  }catch(e){ sheets = []; }

  if(!sheets.length){
    const id = makeSheetId();
    sheets = [{ id, name: 'Sheet 1', createdAt: Date.now() }];
    await persistSheetsIndex();
    // Migrate data saved by the earlier single-sheet version of this page, if any.
    try{
      const legacyEvents = await storageGet('events:data');
      if(legacyEvents && legacyEvents.value){
        await storageSet(`sheet:${id}:events`, legacyEvents.value);
        const legacyMeta = await storageGet('events:meta');
        if(legacyMeta && legacyMeta.value){
          await storageSet(`sheet:${id}:meta`, legacyMeta.value);
        }
      }
    }catch(e){ /* no legacy data, ignore */ }
  }

  let startId = sheets[0].id;
  try{
    const activeRes = await storageGet('sheets:active');
    if(activeRes && activeRes.value && sheets.some(s => s.id === activeRes.value)){
      startId = activeRes.value;
    }
  }catch(e){ /* ignore */ }

  await setActiveSheet(startId, false);
}

async function setActiveSheet(id, persist = true){
  await saveNotesNow(); // flush pending note edits for the sheet we're leaving
  activeSheetId = id;
  openNotesKey = null;
  if(persist) await storageSet('sheets:active', id);
  renderTabs();
  await loadActiveSheetEvents();
}

async function loadActiveSheetEvents(){
  try{
    const res = await storageGet(`sheet:${activeSheetId}:events`);
    allEvents = (res && res.value) ? JSON.parse(res.value) : [];
  }catch(e){ allEvents = []; }
  try{
    const notesRes = await storageGet(`sheet:${activeSheetId}:notes`);
    notes = (notesRes && notesRes.value) ? JSON.parse(notesRes.value) : {};
  }catch(e){ notes = {}; }
  try{
    const meta = await storageGet(`sheet:${activeSheetId}:meta`);
    if(meta && meta.value){
      const m = JSON.parse(meta.value);
      metaLine.textContent = `Loaded ${m.count} events · updated ${new Date(m.uploadedAt).toLocaleString()}`;
    } else {
      metaLine.textContent = '';
    }
  }catch(e){ metaLine.textContent = ''; }
  render();
}

let saveNotesTimer = null;
function saveNotesSoon(){
  clearTimeout(saveNotesTimer);
  saveNotesTimer = setTimeout(saveNotesNow, 500);
}
async function saveNotesNow(){
  clearTimeout(saveNotesTimer);
  try{ await storageSet(`sheet:${activeSheetId}:notes`, JSON.stringify(notes)); }catch(e){ /* ignore */ }
}

// Identifies "the same event" for note-keeping purposes, stable across
// re-uploads as long as the ticket link or name/venue/date stay the same.
function eventKey(ev){
  if(ev.primaryLink && ev.primaryLink.trim()){
    return 'pl:' + ev.primaryLink.trim().toLowerCase();
  }
  return 'nv:' + [ev.name, ev.venue, ev.dateStr].join('|').trim().toLowerCase();
}

async function saveEventsToActiveSheet(events){
  allEvents = events;
  try{
    await storageSet(`sheet:${activeSheetId}:events`, JSON.stringify(events));
    const meta = { count: events.length, uploadedAt: new Date().toISOString() };
    await storageSet(`sheet:${activeSheetId}:meta`, JSON.stringify(meta));
    metaLine.textContent = `Loaded ${meta.count} events · updated ${new Date(meta.uploadedAt).toLocaleString()}`;
  }catch(e){
    metaLine.textContent = `Loaded ${events.length} events (not saved for next visit — storage unavailable)`;
  }
  render();
}

// Uploading a CSV creates a new sheet named after the file, so each
// upload keeps its own tab instead of overwriting the one you're on.
// Exception: if the current sheet is still empty (e.g. right after
// creating it, or on first-ever use), the upload just fills that sheet
// instead of leaving a pointless blank tab behind.
async function handleCsvUpload(file, text){
  const records = recordsFromCSV(text);
  if(!records.length){
    alert('That CSV parsed but produced no rows. Check that it matches the expected format.');
    return;
  }

  if(allEvents.length === 0){
    await saveEventsToActiveSheet(records);
    return;
  }

  const id = makeSheetId();
  const name = sheetNameFromFile(file);
  sheets.push({ id, name, createdAt: Date.now() });
  await persistSheetsIndex();
  await setActiveSheet(id);
  await saveEventsToActiveSheet(records);
}

async function clearActiveSheetEvents(){
  await storageDelete(`sheet:${activeSheetId}:events`);
  await storageDelete(`sheet:${activeSheetId}:meta`);
  allEvents = [];
  metaLine.textContent = '';
  render();
}

async function addSheet(){
  const name = prompt('Name this sheet', `Sheet ${sheets.length + 1}`);
  if(name === null) return;
  const trimmed = name.trim() || `Sheet ${sheets.length + 1}`;
  const id = makeSheetId();
  sheets.push({ id, name: trimmed, createdAt: Date.now() });
  await persistSheetsIndex();
  await setActiveSheet(id);
}

async function renameSheet(id){
  const sheet = sheets.find(s => s.id === id);
  if(!sheet) return;
  const name = prompt('Rename sheet', sheet.name);
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  sheet.name = trimmed;
  await persistSheetsIndex();
  renderTabs();
}

async function deleteSheet(id){
  if(sheets.length <= 1){
    alert("You need at least one sheet — try renaming it or clearing its data instead.");
    return;
  }
  const sheet = sheets.find(s => s.id === id);
  if(!sheet) return;
  if(!confirm(`Delete "${sheet.name}"? This can't be undone.`)) return;
  sheets = sheets.filter(s => s.id !== id);
  await persistSheetsIndex();
  await storageDelete(`sheet:${id}:events`);
  await storageDelete(`sheet:${id}:meta`);
  if(activeSheetId === id){
    await setActiveSheet(sheets[0].id);
  } else {
    renderTabs();
  }
}

function renderTabs(){
  sheetTabs.innerHTML = sheets.map(s => `
    <button class="sheet-tab ${s.id === activeSheetId ? 'active' : ''}" data-id="${s.id}" title="Double-click to rename">
      <span class="tab-label">${escapeHtml(s.name)}</span>
      <span class="tab-close" data-id="${s.id}" title="Delete sheet">×</span>
    </button>
  `).join('') + `<button class="sheet-tab add-tab" id="addSheetBtn" title="Add sheet">+</button>`;

  sheetTabs.querySelectorAll('.sheet-tab:not(.add-tab)').forEach(btn => {
    btn.addEventListener('click', e => {
      if(e.target.classList.contains('tab-close')) return;
      if(btn.dataset.id !== activeSheetId) setActiveSheet(btn.dataset.id);
    });
    btn.addEventListener('dblclick', e => {
      if(e.target.classList.contains('tab-close')) return;
      renameSheet(btn.dataset.id);
    });
  });
  sheetTabs.querySelectorAll('.tab-close').forEach(x => {
    x.addEventListener('click', e => {
      e.stopPropagation();
      deleteSheet(x.dataset.id);
    });
  });
  const addBtn = document.getElementById('addSheetBtn');
  if(addBtn) addBtn.addEventListener('click', addSheet);
}

// ---------- Rendering ----------
function linkRow(href, label, cls){
  if(!href) return '';
  return `
    <div class="link-row">
      <a class="link-btn ${cls}" href="${encodeURI(href)}" target="_blank" rel="noopener noreferrer">${label}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg></a>
      <button type="button" class="copy-btn" data-href="${escapeHtml(href)}" title="Copy ${escapeHtml(label)} link" aria-label="Copy ${escapeHtml(label)} link">
        <svg class="icon-copy" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="icon-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>`;
}

function dayKey(dateObj){
  if(!dateObj) return 'Date TBD';
  const d = new Date(dateObj);
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

function isSameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

// Chronological grouping: one group per calendar day, sorted earliest first.
function groupByDate(events){
  const withDate = events.filter(e => e.dateObj).sort((a,b) => new Date(a.dateObj) - new Date(b.dateObj));
  const withoutDate = events.filter(e => !e.dateObj);

  const groups = [];
  let currentKey = null, currentGroup = null;
  withDate.forEach(ev => {
    const key = dayKey(ev.dateObj);
    if(key !== currentKey){
      currentKey = key;
      currentGroup = { heading: key, showHeading: true, showTodayTag: true, events: [] };
      groups.push(currentGroup);
    }
    currentGroup.events.push(ev);
  });
  if(withoutDate.length){
    groups.push({ heading: 'Date TBD', showHeading: true, showTodayTag: false, events: withoutDate });
  }
  return groups;
}

// Preserves the exact row order from the CSV, grouping consecutive rows
// that share a venue — this keeps blocks like "Arthur Ashe" / "Louis
// Armstrong" / "Grandstand" together the way they appeared in the sheet,
// instead of interleaving them by date. A heading is only shown when a
// venue actually repeats across consecutive rows (a real block); a sheet
// where every event has its own unique venue would otherwise get a
// heading per single card, which is just noise.
function groupByUploadOrder(events){
  const groups = [];
  let currentKey = null, currentGroup = null;
  events.forEach(ev => {
    const key = (ev.venue && ev.venue.trim()) ? ev.venue.trim() : 'Other';
    if(key !== currentKey){
      currentKey = key;
      currentGroup = { heading: key, showTodayTag: false, events: [] };
      groups.push(currentGroup);
    }
    currentGroup.events.push(ev);
  });
  groups.forEach(g => { g.showHeading = g.events.length > 1; });
  return groups;
}

function render(){
  const query = searchInput.value.trim().toLowerCase();
  const hasData = allEvents.length > 0;
  emptyState.style.display = hasData ? 'none' : 'block';
  clearBtn.style.display = hasData ? 'inline-block' : 'none';

  if(!hasData){
    listRoot.innerHTML = '';
    countLabel.textContent = '';
    return;
  }

  // allEvents.filter preserves original array order, which is what
  // "As uploaded" mode relies on.
  let filtered = allEvents.filter(ev => {
    if(!query) return true;
    const haystack = [ev.name, ev.venue, ev.primaryLink, ev.vividLink, ev.stubLink].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  countLabel.textContent = `${filtered.length} of ${allEvents.length}`;

  const groups = sortMode === 'upload' ? groupByUploadOrder(filtered) : groupByDate(filtered);

  if(!groups.length){
    listRoot.innerHTML = '<div class="no-results">No events match your search.</div>';
    return;
  }

  const now = new Date();
  listRoot.innerHTML = groups.map(g => {
    const firstEv = g.events[0];
    const isToday = g.showTodayTag && firstEv.dateObj && isSameDay(new Date(firstEv.dateObj), now);
    const heading = g.showHeading
      ? `<div class="day-heading">${escapeHtml(g.heading)}${isToday ? '<span class="tag-today">Today</span>' : ''}</div>`
      : '';
    const tickets = g.events.map(ev => {
      // Full date + time inside the card itself, not just the time, so
      // each card reads on its own even without a date-based heading
      // above it (e.g. in "As uploaded" mode).
      const dateTime = ev.dateObj
        ? new Date(ev.dateObj).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) +
          ' · ' + new Date(ev.dateObj).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'})
        : '';
      const buttons = [
        linkRow(ev.primaryLink, siteLabel(ev.primarySite), siteClass(ev.primarySite)),
        linkRow(ev.vividLink, 'VividSeats', 'site-vivid'),
        linkRow(ev.stubLink, 'StubHub', 'site-stub')
      ].filter(Boolean).join('');
      const key = eventKey(ev);
      const noteText = notes[key] || '';
      const isNotesOpen = key === openNotesKey;
      const notePreview = (!isNotesOpen && noteText.trim())
        ? `<div class="notes-preview"><div class="note-preview-text">${escapeHtml(noteText.trim().length > 90 ? noteText.trim().slice(0,90) + '…' : noteText.trim())}</div></div>`
        : '';
      return `
        <div class="ticket" data-key="${escapeHtml(key)}">
          <div class="ticket-toolbar">
            <button type="button" class="icon-btn notes-btn ${isNotesOpen ? 'active' : ''} ${noteText.trim() ? 'has-note' : ''}" data-action="notes" data-key="${escapeHtml(key)}" title="Notes">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            </button>
          </div>
          <div class="ticket-main">
            <div class="ticket-info">
              <div class="ev-name">${escapeHtml(ev.name)}</div>
              <div class="ev-venue">${escapeHtml(ev.venue)}</div>
              ${dateTime ? `<div class="ev-time">${dateTime}</div>` : ''}
            </div>
            <div class="perf"></div>
            <div class="ticket-actions">
              ${buttons || '<span class="no-links">No ticket links yet</span>'}
            </div>
          </div>
          ${isNotesOpen ? `
          <div class="notes-panel" data-panel-key="${escapeHtml(key)}">
            <p class="notes-label">Notes</p>
            <textarea class="notes-textarea" placeholder="Anything worth remembering about this one…" data-key="${escapeHtml(key)}">${escapeHtml(noteText)}</textarea>
          </div>` : notePreview}
        </div>`;
    }).join('');
    return heading + `<div class="day-grid">${tickets}</div>`;
  }).join('');
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Events ----------
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      handleCsvUpload(file, ev.target.result);
    }catch(err){
      alert('Could not read that CSV: ' + err.message);
    }
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
  fileInput.value = '';
});

clearBtn.addEventListener('click', () => {
  const sheet = sheets.find(s => s.id === activeSheetId);
  if(confirm(`Clear all events on "${sheet ? sheet.name : 'this sheet'}"?`)) clearActiveSheetEvents();
});

searchInput.addEventListener('input', render);

sortToggle.addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if(!btn || btn.dataset.sort === sortMode) return;
  sortMode = btn.dataset.sort;
  sortToggle.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === sortMode));
  render();
});

// Copies a ticket link to the clipboard and briefly shows a checkmark on
// the button that triggered it. Falls back to a hidden-textarea copy for
// browsers/contexts (e.g. non-HTTPS) where the async clipboard API is
// unavailable.
async function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){ /* fall through to legacy method */ }
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  }catch(e){
    return false;
  }
}

listRoot.addEventListener('click', async e => {
  const copyBtn = e.target.closest('.copy-btn');
  if(copyBtn){
    const ok = await copyToClipboard(copyBtn.dataset.href);
    if(ok){
      copyBtn.classList.add('copied');
      clearTimeout(copyBtn._copyTimeout);
      copyBtn._copyTimeout = setTimeout(() => copyBtn.classList.remove('copied'), 1400);
    } else {
      alert('Could not copy that link — your browser may be blocking clipboard access.');
    }
    return;
  }

  // Notes panel toggle. Re-rendering keeps the always-visible preview in
  // sync with whatever was just typed, and ensures only one card's panel
  // is open at a time.
  const notesBtn = e.target.closest('[data-action="notes"]');
  if(notesBtn){
    const key = notesBtn.dataset.key;
    openNotesKey = (openNotesKey === key) ? null : key;
    render();
    if(openNotesKey === key){
      const ta = listRoot.querySelector(`.ticket[data-key="${CSS.escape(key)}"] .notes-textarea`);
      if(ta) ta.focus();
    }
    return;
  }

  // Best-effort "open in background tab" behavior: we can't force this
  // (browsers intentionally don't let pages control tab focus), but calling
  // window.focus() right after window.open() pulls focus back to this tab
  // in most desktop browsers. Ctrl/Cmd/Shift-clicks and middle-clicks are
  // left alone so the browser's own native background-tab handling applies.
  const link = e.target.closest('a.link-btn');
  if(!link) return;
  if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
  e.preventDefault();
  window.open(link.href, '_blank', 'noopener,noreferrer');
  window.focus();
});

// Typing in a note updates the in-memory map and saves shortly after,
// without a full re-render (which would drop focus mid-type).
listRoot.addEventListener('input', e => {
  const textarea = e.target.closest('.notes-textarea');
  if(!textarea) return;
  const key = textarea.dataset.key;
  notes[key] = textarea.value;
  saveNotesSoon();
  const notesBtn = textarea.closest('.ticket').querySelector('.notes-btn');
  if(notesBtn) notesBtn.classList.toggle('has-note', !!textarea.value.trim());
});

['dragenter','dragover'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag'); });
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      handleCsvUpload(file, ev.target.result);
    }catch(err){
      alert('Could not read that CSV: ' + err.message);
    }
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
});

window.addEventListener('beforeunload', () => { saveNotesNow(); });

loadColumnCount();
loadSheets();
</script>
